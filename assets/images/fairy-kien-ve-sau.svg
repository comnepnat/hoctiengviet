<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <clipPath id="paperClip"><rect x="18" y="18" width="764" height="414" rx="22"/></clipPath>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="sky7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE4B0"/>
      <stop offset="55%" stop-color="#FFF7E2"/>
      <stop offset="100%" stop-color="#E7F2D4"/>
    </linearGradient>
    
  </defs>
  <rect width="800" height="450" fill="#FDF8EE"/>
  <g clip-path="url(#paperClip)">
    
    <rect x="18" y="18" width="764" height="414" fill="url(#sky7)"/>
    <circle cx="155" cy="96" r="44" fill="#FBE082" stroke="#D9A84E" stroke-width="2.4"/>
    <!-- Sunny hills -->
    <path d="M18 275 Q230 220 460 270 T782 250 L782 432 L18 432 Z" fill="#B4CE94"/>
    <path d="M18 335 Q280 302 520 338 T782 325 L782 432 L18 432 Z" fill="#92B572"/>
    <!-- Cozy anthill home on left -->
    <g transform="translate(55, 222)">
      <path d="M15 150 C25 68 75 28 135 28 C195 28 240 68 255 150 Z" fill="#D4A472" stroke="#6E4F33" stroke-width="2.8"/>
      <path d="M105 150 L105 98 A28 28 0 0 1 161 98 L161 150 Z" fill="#6E4E34" stroke="#4D3623" stroke-width="2.5"/>
      <circle cx="133" cy="94" r="10" fill="#FBE082" opacity="0.65"/>
      <circle cx="80" cy="86" r="14" fill="#FBE082" stroke="#6E4F33" stroke-width="2.4"/>
      <circle cx="186" cy="86" r="14" fill="#FBE082" stroke="#6E4F33" stroke-width="2.4"/>
    </g>
    <!-- Hardworking happy little ants carrying golden wheat grains -->
    <g transform="translate(260, 326)">
      <!-- Ant 1 -->
      <g>
        <ellipse cx="22" cy="40" rx="14" ry="11" fill="#A65A46" stroke="#4D2920" stroke-width="2.2"/>
        <ellipse cx="44" cy="40" rx="10" ry="9" fill="#BA6953" stroke="#4D2920" stroke-width="2.2"/>
        <circle cx="64" cy="34" r="13" fill="#C9735B" stroke="#4D2920" stroke-width="2.2"/>
        <circle cx="68" cy="32" r="2.4" fill="#3E2F26"/>
        <path d="M62 40 Q67 44 72 40" stroke="#3E2F26" stroke-width="2" stroke-linecap="round"/>
        <path d="M62 21 Q56 10 48 12 M68 21 Q74 10 82 12" stroke="#4D2920" stroke-width="2" stroke-linecap="round"/>
        <path d="M22 50 L16 62 M40 49 L38 62 M50 49 L56 62" stroke="#4D2920" stroke-width="2.4" stroke-linecap="round"/>
        <!-- Golden grain carried on back -->
        <ellipse cx="34" cy="18" rx="22" ry="11" transform="rotate(-12 34 18)" fill="#F2C45A" stroke="#9C7323" stroke-width="2.2"/>
      </g>
      <!-- Ant 2 -->
      <g transform="translate(110, 8)">
        <ellipse cx="22" cy="40" rx="14" ry="11" fill="#A65A46" stroke="#4D2920" stroke-width="2.2"/>
        <ellipse cx="44" cy="40" rx="10" ry="9" fill="#BA6953" stroke="#4D2920" stroke-width="2.2"/>
        <circle cx="64" cy="34" r="13" fill="#C9735B" stroke="#4D2920" stroke-width="2.2"/>
        <circle cx="68" cy="32" r="2.4" fill="#3E2F26"/>
        <path d="M62 40 Q67 44 72 40" stroke="#3E2F26" stroke-width="2" stroke-linecap="round"/>
        <path d="M62 21 Q56 10 48 12 M68 21 Q74 10 82 12" stroke="#4D2920" stroke-width="2" stroke-linecap="round"/>
        <path d="M22 50 L16 62 M40 49 L38 62 M50 49 L56 62" stroke="#4D2920" stroke-width="2.4" stroke-linecap="round"/>
        <ellipse cx="34" cy="18" rx="20" ry="10" transform="rotate(-8 34 18)" fill="#F2C45A" stroke="#9C7323" stroke-width="2.2"/>
      </g>
    </g>
    <!-- Leafy Tree Branch & Cheerful Singing Cicada playing Guitar -->
    <g transform="translate(475, 118)">
      <path d="M308 118 Q210 124 120 156 Q65 174 28 164" stroke="#8C6242" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M308 118 Q210 124 120 156 Q65 174 28 164" stroke="#5A3D28" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <!-- Leaves -->
      <ellipse cx="42" cy="148" rx="28" ry="12" transform="rotate(-28 42 148)" fill="#7EB067" stroke="#4D733D" stroke-width="2"/>
      <ellipse cx="235" cy="100" rx="30" ry="13" transform="rotate(18 235 100)" fill="#7EB067" stroke="#4D733D" stroke-width="2"/>
      <ellipse cx="268" cy="146" rx="28" ry="12" transform="rotate(-14 268 146)" fill="#8FC076" stroke="#4D733D" stroke-width="2"/>
      <!-- Friendly Green Cicada -->
      <g transform="translate(92, 42)">
        <!-- Translucent wings -->
        <ellipse cx="75" cy="64" rx="46" ry="16" transform="rotate(24 75 64)" fill="#E6F4F0" stroke="#5E877B" stroke-width="2" opacity="0.88"/>
        <ellipse cx="78" cy="52" rx="42" ry="14" transform="rotate(8 78 52)" fill="#F2FAF8" stroke="#5E877B" stroke-width="2" opacity="0.9"/>
        <!-- Body & head -->
        <ellipse cx="44" cy="68" rx="24" ry="34" transform="rotate(-14 44 68)" fill="#7EB876" stroke="#456E41" stroke-width="2.5"/>
        <circle cx="38" cy="30" r="21" fill="#8ECA85" stroke="#456E41" stroke-width="2.5"/>
        <circle cx="30" cy="27" r="4" fill="#3E2F26"/><circle cx="29" cy="26" r="1.4" fill="#FFF"/>
        <circle cx="46" cy="27" r="4" fill="#3E2F26"/><circle cx="45" cy="26" r="1.4" fill="#FFF"/>
        <path d="M32 37 Q38 43 44 37" stroke="#3E2F26" stroke-width="2.4" stroke-linecap="round"/>
        <!-- Tiny wooden guitar -->
        <g transform="translate(-14, 52) rotate(-25)">
          <ellipse cx="28" cy="26" rx="18" ry="14" fill="#DF9C59" stroke="#6E4724" stroke-width="2.2"/>
          <circle cx="28" cy="26" r="5" fill="#6E4724"/>
          <rect x="44" y="23" width="32" height="6" rx="2" fill="#8C5B32" stroke="#6E4724" stroke-width="1.8"/>
        </g>
        <!-- Musical notes floating -->
        <g fill="#E07A5F">
          <circle cx="-18" cy="18" r="5"/><path d="M-13 18 V-4 L4 -8 V14" stroke="#E07A5F" stroke-width="3" fill="none"/><circle cx="-1" cy="14" r="5"/>
          <circle cx="-44" cy="34" r="4.5"/><path d="M-39.5 34 V14 L-28 11" stroke="#E5AA3E" stroke-width="3" fill="none"/>
        </g>
      </g>
    </g>
    
  </g>
  <rect x="18" y="18" width="764" height="414" rx="22" stroke="#D9C7AE" stroke-width="3" fill="none"/>
</svg>
