<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <clipPath id="paperClip"><rect x="18" y="18" width="764" height="414" rx="22"/></clipPath>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBE6F4"/>
      <stop offset="60%" stop-color="#FFF5DE"/>
      <stop offset="100%" stop-color="#FCE7C2"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BB7D3"/>
      <stop offset="100%" stop-color="#A8D5E5"/>
    </linearGradient>
    <linearGradient id="sand2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7DFAF"/>
      <stop offset="100%" stop-color="#E8C688"/>
    </linearGradient>
    
  </defs>
  <rect width="800" height="450" fill="#FDF8EE"/>
  <g clip-path="url(#paperClip)">
    
    <rect x="18" y="18" width="764" height="414" fill="url(#sky2)"/>
    <!-- Warm sun -->
    <circle cx="645" cy="96" r="42" fill="#FBE082" stroke="#D9A84E" stroke-width="2.4"/>
    <!-- Clouds & White Seabirds -->
    <g fill="#FFFDF8" opacity="0.9">
      <ellipse cx="170" cy="84" rx="64" ry="20"/><ellipse cx="140" cy="76" rx="34" ry="18"/>
      <ellipse cx="430" cy="70" rx="50" ry="16"/>
    </g>
    <g stroke="#5A4A3E" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M285 95 Q296 82 308 94 Q320 82 332 95"/>
      <path d="M350 118 Q359 108 368 117 Q377 108 386 118"/>
      <path d="M510 102 Q520 90 530 101 Q540 90 550 102"/>
    </g>
    <!-- Ocean & gentle ripples -->
    <rect x="18" y="205" width="764" height="115" fill="url(#sea2)"/>
    <g stroke="#EAF7FC" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M60 232 Q95 224 130 232 T200 232"/>
      <path d="M510 245 Q555 236 600 245 T690 245"/>
      <path d="M310 262 Q350 255 390 262"/>
    </g>
    <!-- Island sandy shore & green meadow -->
    <path d="M18 285 Q240 240 480 278 T782 260 L782 432 L18 432 Z" fill="url(#sand2)"/>
    <path d="M18 320 Q180 270 390 315 Q600 355 782 308 L782 432 L18 432 Z" fill="#9BC083" stroke="#6E945B" stroke-width="2"/>
    <!-- Cozy thatched hut on island left -->
    <g transform="translate(56, 175)">
      <rect x="20" y="55" width="95" height="62" rx="6" fill="#E8C99B" stroke="#5A4332" stroke-width="2.5"/>
      <rect x="52" y="75" width="28" height="42" rx="4" fill="#9E734F" stroke="#5A4332" stroke-width="2.2"/>
      <path d="M6 62 L68 12 L130 62 Z" fill="#DFB66C" stroke="#5A4332" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M30 48 L48 60 M68 25 L68 60 M105 48 L88 60" stroke="#B68B46" stroke-width="2"/>
    </g>
    <!-- Watermelon vines -->
    <path d="M90 365 Q210 340 330 375 T590 360 T745 385" stroke="#5A874A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <g fill="#73A85A" stroke="#4D733D" stroke-width="2">
      <ellipse cx="145" cy="355" rx="18" ry="10" transform="rotate(-15 145 355)"/>
      <ellipse cx="320" cy="362" rx="18" ry="10" transform="rotate(20 320 362)"/>
      <ellipse cx="645" cy="358" rx="18" ry="10" transform="rotate(-18 645 358)"/>
    </g>
    <!-- Smiling Mai An Tiêm family (Father & Child) -->
    <g transform="translate(245, 198)">
      <!-- Father -->
      <path d="M18 82 Q44 74 70 82 L76 138 L12 138 Z" fill="#B68E68" stroke="#4F4035" stroke-width="2.6"/>
      <circle cx="44" cy="48" r="24" fill="#FCE0C5" stroke="#4F4035" stroke-width="2.6"/>
      <path d="M22 42 C24 20 64 20 66 42 Q44 34 22 42 Z" fill="#4B392E"/>
      <circle cx="36" cy="49" r="3.2" fill="#3E2F26"/><circle cx="52" cy="49" r="3.2" fill="#3E2F26"/>
      <circle cx="30" cy="55" r="4" fill="#E89A89" opacity="0.5"/><circle cx="58" cy="55" r="4" fill="#E89A89" opacity="0.5"/>
      <path d="M38 58 Q44 64 50 58" stroke="#3E2F26" stroke-width="2.4" stroke-linecap="round"/>
      <!-- Happy Child beside him -->
      <g transform="translate(78, 34)">
        <path d="M14 58 Q34 52 54 58 L58 102 L10 102 Z" fill="#E89A78" stroke="#4F4035" stroke-width="2.4"/>
        <circle cx="34" cy="34" r="20" fill="#FCE0C5" stroke="#4F4035" stroke-width="2.4"/>
        <path d="M16 30 C18 12 50 12 52 30 Q34 24 16 30 Z" fill="#4B392E"/>
        <circle cx="28" cy="35" r="2.8" fill="#3E2F26"/><circle cx="41" cy="35" r="2.8" fill="#3E2F26"/>
        <circle cx="23" cy="40" r="3.5" fill="#E89A89" opacity="0.5"/><circle cx="46" cy="40" r="3.5" fill="#E89A89" opacity="0.5"/>
        <path d="M29 43 Q34 48 40 43" stroke="#3E2F26" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </g>
    <!-- Giant striped green watermelons + juicy red slice foreground -->
    <g transform="translate(465, 305)">
      <!-- Whole Watermelon 1 -->
      <ellipse cx="62" cy="52" rx="54" ry="44" fill="#5D9B52" stroke="#3D6437" stroke-width="3"/>
      <path d="M38 14 Q28 52 38 90 M62 8 Q56 52 62 96 M86 14 Q96 52 86 90" stroke="#3D6437" stroke-width="5" stroke-linecap="round" opacity="0.55" fill="none"/>
      <!-- Whole Watermelon 2 -->
      <ellipse cx="165" cy="60" rx="46" ry="38" fill="#68A85B" stroke="#3D6437" stroke-width="3"/>
      <path d="M146 25 Q138 60 146 95 M165 22 Q160 60 165 98 M184 25 Q192 60 184 95" stroke="#3D6437" stroke-width="4.5" stroke-linecap="round" opacity="0.55" fill="none"/>
      <!-- Fresh juicy watermelon slice -->
      <g transform="translate(-25, 42)">
        <path d="M10 15 A70 70 0 0 0 142 15 Z" fill="#528F47" stroke="#3D6437" stroke-width="2.8" stroke-linejoin="round"/>
        <path d="M20 15 A60 60 0 0 0 132 15 Z" fill="#F2F0D8"/>
        <path d="M26 15 A54 54 0 0 0 126 15 Z" fill="#EA6D63"/>
        <g fill="#3E2F26">
          <ellipse cx="52" cy="36" rx="3.2" ry="5" transform="rotate(-20 52 36)"/>
          <ellipse cx="76" cy="44" rx="3.2" ry="5"/>
          <ellipse cx="100" cy="36" rx="3.2" ry="5" transform="rotate(20 100 36)"/>
          <ellipse cx="64" cy="28" rx="2.8" ry="4.5" transform="rotate(-10 64 28)"/>
          <ellipse cx="88" cy="28" rx="2.8" ry="4.5" transform="rotate(10 88 28)"/>
        </g>
      </g>
    </g>
    <!-- Floating watermelon on wave -->
    <ellipse cx="695" cy="284" rx="22" ry="17" fill="#5D9B52" stroke="#3D6437" stroke-width="2.4"/>
    <path d="M670 294 Q695 286 720 294" stroke="#EAF7FC" stroke-width="3.5" stroke-linecap="round"/>
    
  </g>
  <rect x="18" y="18" width="764" height="414" rx="22" stroke="#D9C7AE" stroke-width="3" fill="none"/>
</svg>
