      <ellipse cx="118" cy="122" rx="22" ry="15" fill="#FFF3E0"/>
      <circle cx="101" cy="104" r="5.5" fill="#3E2F26"/><circle cx="99.5" cy="102" r="2" fill="#FFF"/>
