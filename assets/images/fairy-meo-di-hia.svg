<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <clipPath id="paperClip"><rect x="18" y="18" width="764" height="414" rx="22"/></clipPath>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4E8F5"/>
      <stop offset="65%" stop-color="#FFF5E2"/>
      <stop offset="100%" stop-color="#F7E5C8"/>
    </linearGradient>
    
  </defs>
  <rect width="800" height="450" fill="#FDF8EE"/>
  <g clip-path="url(#paperClip)">
    
    <rect x="18" y="18" width="764" height="414" fill="url(#sky5)"/>
    <!-- Pastel fairytale castle on distant hill -->
    <g transform="translate(530, 88)" opacity="0.9">
      <rect x="30" y="70" width="90" height="80" fill="#F7EFE1" stroke="#8C735B" stroke-width="2.2"/>
      <rect x="15" y="45" width="32" height="105" fill="#F2E4CE" stroke="#8C735B" stroke-width="2.2"/>
      <rect x="103" y="45" width="32" height="105" fill="#F2E4CE" stroke="#8C735B" stroke-width="2.2"/>
