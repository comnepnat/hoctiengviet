<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <clipPath id="paperClip"><rect x="18" y="18" width="764" height="414" rx="22"/></clipPath>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE0CA"/>
      <stop offset="55%" stop-color="#FFF4DE"/>
      <stop offset="100%" stop-color="#D7EAF4"/>
    </linearGradient>
    <linearGradient id="pond4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A6D1E6"/>
      <stop offset="100%" stop-color="#79B1CE"/>
    </linearGradient>
    
  </defs>
  <rect width="800" height="450" fill="#FDF8EE"/>
  <g clip-path="url(#paperClip)">
    
    <rect x="18" y="18" width="764" height="414" fill="url(#sky4)"/>
    <circle cx="400" cy="115" r="52" fill="#FDE49B" opacity="0.85"/>
    <!-- Soft meadow bank -->
    <path d="M18 228 Q210 185 400 212 T782 198 L782 260 L18 260 Z" fill="#A9C895"/>
    <!-- Tranquil sparkling pond -->
    <rect x="18" y="235" width="764" height="197" fill="url(#pond4)"/>
    <!-- Water ripples & sunlight glints -->
    <g stroke="#EFF9FD" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M220 355 Q310 345 400 355 T580 355"/>
      <path d="M265 378 Q340 370 415 378 T540 378"/>
      <path d="M80 285 Q130 278 180 285"/>
      <path d="M620 295 Q675 288 730 295"/>
    </g>
    <!-- Reeds left & right -->
    <g stroke="#5F8651" stroke-width="4" stroke-linecap="round">
      <path d="M72 432 Q85 320 65 215"/><path d="M98 432 Q115 335 104 245"/>
      <path d="M720 432 Q705 320 726 218"/><path d="M694 432 Q678 340 688 250"/>
    </g>
    <g fill="#9C6B49">
      <ellipse cx="65" cy="222" rx="6" ry="18" transform="rotate(-6 65 222)"/>
      <ellipse cx="726" cy="225" rx="6" ry="18" transform="rotate(6 726 225)"/>
    </g>
    <!-- Floating pink lotus pads & flowers -->
    <g>
      <ellipse cx="170" cy="365" rx="46" ry="16" fill="#6F9F62" stroke="#4D7344" stroke-width="2"/>
      <path d="M150 360 Q170 330 190 360 Z" fill="#F4A9B4" stroke="#B86B78" stroke-width="2"/>
      <path d="M160 360 Q170 336 180 360 Z" fill="#FAD2D8"/>
      <ellipse cx="628" cy="362" rx="44" ry="15" fill="#6F9F62" stroke="#4D7344" stroke-width="2"/>
      <path d="M610 358 Q628 330 646 358 Z" fill="#F4A9B4" stroke="#B86B78" stroke-width="2"/>
    </g>
    <!-- Graceful White Swan center -->
    <g transform="translate(275, 130)">
      <!-- Reflection glow on water -->
      <ellipse cx="122" cy="208" rx="95" ry="22" fill="#FFFFFF" opacity="0.32"/>
      <!-- Swan feathered body -->
      <path d="M40 165 C42 118 102 95 168 112 C210 122 238 145 232 178 C218 198 168 205 110 202 C64 198 38 188 40 165 Z" fill="#FFFDF8" stroke="#6E5A4B" stroke-width="2.8" stroke-linejoin="round"/>
      <!-- Wing layers -->
      <path d="M72 134 C112 108 166 114 202 142 C178 164 126 174 78 160 Z" fill="#F4EFE6" stroke="#6E5A4B" stroke-width="2.2"/>
      <path d="M96 146 C126 130 166 134 190 154" stroke="#B8A99A" stroke-width="2" fill="none"/>
      <!-- Graceful S-curve neck & head -->
      <path d="M192 144 C216 125 224 90 212 60 C204 40 214 20 232 22 C248 24 252 44 238 56 C228 65 238 96 226 135" fill="#FFFDF8" stroke="#6E5A4B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="232" cy="36" r="18" fill="#FFFDF8" stroke="#6E5A4B" stroke-width="2.6"/>
      <!-- Beak -->
      <path d="M248 34 L272 40 L248 46 Z" fill="#E89A54" stroke="#6E5A4B" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Gentle smiling eye & blush -->
      <circle cx="236" cy="33" r="3.4" fill="#3E2F26"/>
      <circle cx="235" cy="32" r="1.2" fill="#FFF"/>
      <circle cx="240" cy="41" r="4" fill="#F09E97" opacity="0.5"/>
      <!-- Tiny golden sparkles around swan -->
      <g fill="#F8D26A">
        <path d="M168 42 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/>
        <path d="M286 78 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"/>
      </g>
    </g>
    <!-- Two friendly little ducklings swimming happily behind -->
    <g transform="translate(110, 260)">
      <ellipse cx="38" cy="36" rx="22" ry="14" fill="#F6D166" stroke="#6E5A4B" stroke-width="2.2"/>
      <circle cx="52" cy="20" r="12" fill="#F6D166" stroke="#6E5A4B" stroke-width="2.2"/>
      <polygon points="62,19 72,22 62,25" fill="#E07A5F"/>
      <circle cx="55" cy="18" r="2.4" fill="#3E2F26"/>
    </g>
    
  </g>
  <rect x="18" y="18" width="764" height="414" rx="22" stroke="#D9C7AE" stroke-width="3" fill="none"/>
</svg>
