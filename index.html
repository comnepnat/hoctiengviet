<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFBF2" />
  <meta name="description" content="Bi Bô — Ứng dụng học nói tiếng Việt tự nhiên, nhẹ nhàng theo phương pháp Montessori và tương tác giọng nói cho bé từ 18 tháng đến 3 tuổi." />
  <title>Bi Bô — Học Nói Tự Nhiên Cho Bé (18 tháng – 3 tuổi)</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/components.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top Bar -->
    <header id="app-header" class="top-bar" role="banner">
      <div class="top-bar__left">
        <button id="btn-home" class="icon-pill hidden" aria-label="Về trang chủ">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
          <span class="icon-pill__label">Trang chủ</span>
        </button>
        <div id="brand-mark" class="brand-mark">
          <span class="brand-mark__dot" aria-hidden="true"></span>
          <span class="brand-mark__name">Bi Bô</span>
        </div>
      </div>

      <div class="top-bar__right">
        <span id="age-indicator" class="stage-tag" title="Giai đoạn hiện tại">18–24 tháng</span>
        <button id="btn-parents-gate" class="parent-lock-btn" aria-label="Góc Ba Mẹ (giữ 1,5 giây để mở)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Ba Mẹ</span>
        </button>
      </div>
    </header>

    <!-- Main Dynamic View Container -->
    <main id="main-content" class="main-stage" role="main" aria-live="polite"></main>

    <!-- Floating Celebration Layer -->
    <div id="celebration-layer" class="celebration-layer" aria-hidden="true"></div>

    <!-- Gentle Toast Notification -->
    <div id="toast-banner" class="toast-banner" role="status" aria-live="polite"></div>

    <!-- Parent Gate Modal (Prevents accidental toddler taps into Parent Settings) -->
    <div id="parent-gate-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="parent-gate-title">
      <div class="modal-card">
        <button id="parent-gate-close" class="modal-close-btn" aria-label="Đóng">✕</button>
        <p class="modal-eyebrow">Góc dành riêng cho Ba Mẹ</p>
        <h2 id="parent-gate-title" class="modal-title">Giữ nút bên dưới để mở</h2>
        <p class="modal-desc">Cổng nhỏ giúp bé không vô tình bấm vào phần cài đặt và thu âm.</p>
        <div class="hold-gate-wrap">
          <button id="parent-hold-btn" class="hold-gate-btn" type="button">
            <span class="hold-gate-btn__fill" id="parent-hold-fill"></span>
            <span class="hold-gate-btn__text" id="parent-hold-text">Nhấn giữ 1,5 giây</span>
          </button>
        </div>
        <button id="parent-math-fallback" class="text-link-btn" type="button">Hoặc bấm nhanh: 2 + 3 = 5</button>
      </div>
    </div>

    <!-- Gentle Sleepy Wind-Down Overlay (Screen-Time Protection) -->
    <div id="bedtime-overlay" class="bedtime-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="bedtime-title">
      <div class="bedtime-card">
        <img src="./assets/images/mascot-sleepy.jpg" alt="Bạn Gấu Mây buồn ngủ" class="bedtime-card__img" />
        <h2 id="bedtime-title" class="bedtime-card__title">Bạn Gấu buồn ngủ rồi!</h2>
        <p class="bedtime-card__desc">Mình đã chơi thật vui rồi. Hẹn bé ngày mai cùng tập nói tiếp nhé! Chào tạm biệt bạn Gấu nào.</p>
        <div class="bedtime-card__actions">
          <button id="bedtime-wave-btn" class="btn-primary-soft" type="button">👋 Chào bạn Gấu nhé!</button>
          <button id="bedtime-extend-btn" class="text-link-btn" type="button">Ba Mẹ: Cho bé chơi thêm 5 phút</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
